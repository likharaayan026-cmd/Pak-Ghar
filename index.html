<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>PakGhar • Ghar Jaisa Khana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fdf9f3;--bg-gradient:linear-gradient(180deg,#fdf9f3 0%,#fefcf9 100%);
  --surface:#ffffff;--surface-warm:#fdf6ef;--surface-glass:rgba(255,255,255,0.85);
  --text-primary:#2a1f1a;--text-secondary:#5c4a40;--text-muted:#8b7a70;
  --accent:#c65d3b;--accent-2:#a8492a;--accent-warm:#e07a4f;--accent-soft:#fbe9df;
  --green:#25d366;--green-2:#128c7e;
  --accent-glow:rgba(198,93,59,0.28);
  --border:#eadfd2;--border-strong:#d9c8b5;
  --shadow-xs:0 1px 2px rgba(60,40,25,0.05);--shadow-sm:0 2px 8px rgba(60,40,25,0.06);
  --shadow-md:0 8px 24px rgba(60,40,25,0.09);--shadow-lg:0 20px 50px rgba(60,40,25,0.13);
  --shadow-warm:0 10px 32px rgba(198,93,59,0.22);
  --radius:24px;--radius-sm:16px;
  --font:'Poppins','Inter',system-ui,-apple-system,sans-serif;
  --font-display:'Playfair Display','Poppins',serif;
  --nav-h:76px;
}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);background-image:var(--bg-gradient);
  background-attachment:fixed;color:var(--text-primary);line-height:1.55;min-height:100vh;
  overflow-x:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 20px);
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px}
button,input,select{font-family:var(--font)}

/* ===== LANGUAGE MODAL ===== */
.lang-modal{position:fixed;inset:0;z-index:11000;background:linear-gradient(160deg,#2a1f1a 0%,#1a1008 100%);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity 0.5s,visibility 0.5s;overflow:hidden}
.lang-modal.hidden{opacity:0;visibility:hidden;pointer-events:none}
.lang-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lang-particle{position:absolute;font-size:22px;opacity:0;animation:floatUpLang linear infinite;filter:drop-shadow(0 0 12px rgba(224,122,79,0.5))}
@keyframes floatUpLang{0%{transform:translateY(100vh) rotate(0deg) scale(0.6);opacity:0}10%{opacity:0.9}90%{opacity:0.9}100%{transform:translateY(-20vh) rotate(360deg) scale(1.1);opacity:0}}
.lang-card{background:rgba(255,250,245,0.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,250,245,0.12);border-radius:28px;padding:32px 24px 28px;max-width:420px;width:100%;text-align:center;animation:langCardIn 0.7s cubic-bezier(.34,1.56,.64,1);position:relative;z-index:2;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
@keyframes langCardIn{0%{opacity:0;transform:scale(0.85) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.lang-logo{font-size:64px;line-height:1;margin-bottom:14px;filter:drop-shadow(0 0 30px rgba(224,122,79,0.7));animation:logoBounce 2s ease-in-out infinite}
@keyframes logoBounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.lang-title{font-size:1.75rem;font-weight:700;color:#fefcf9;letter-spacing:-0.5px;margin-bottom:6px;font-family:var(--font-display)}
.lang-title span{background:linear-gradient(135deg,#e07a4f,#f0b27a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lang-sub{color:#b0a096;font-size:0.88rem;margin-bottom:26px}
.lang-options{display:flex;flex-direction:column;gap:12px}
.lang-btn{padding:16px 20px;border-radius:18px;border:1.5px solid rgba(224,122,79,0.3);background:rgba(224,122,79,0.08);color:#fefcf9;font-size:1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all 0.3s;text-align:left}
.lang-btn:hover{background:rgba(224,122,79,0.18);border-color:#e07a4f;transform:translateY(-2px)}
.lang-btn:active{transform:scale(0.97)}
.lang-btn .flag{font-size:1.6rem}
.lang-btn .lang-name{font-weight:700}
.lang-btn .lang-desc{font-size:0.75rem;color:#b0a096;font-weight:400;margin-top:2px}
.lang-btn .lang-arrow{margin-left:auto;color:#e07a4f;font-size:1.1rem}

/* Language switch overlay */
.lang-switch-overlay{position:fixed;inset:0;z-index:12000;background:linear-gradient(160deg,#2a1f1a 0%,#1a1008 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:opacity 0.35s ease,visibility 0.35s;pointer-events:none}
.lang-switch-overlay.active{opacity:1;visibility:visible;pointer-events:auto}
.lang-switch-icon{font-size:5rem;margin-bottom:18px;animation:langIconSpin 1s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes langIconSpin{0%{transform:rotate(-180deg) scale(0.3);opacity:0}60%{transform:rotate(10deg) scale(1.1);opacity:1}100%{transform:rotate(0) scale(1);opacity:1}}
.lang-switch-text{font-size:1.3rem;font-weight:700;color:#fefcf9;font-family:var(--font-display)}
.lang-switch-text span{background:linear-gradient(135deg,#e07a4f,#f0b27a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lang-switch-sub{font-size:0.85rem;color:#b0a096;margin-top:6px}
.lang-switch-dots{display:flex;gap:8px;margin-top:26px}
.lang-switch-dots span{width:8px;height:8px;border-radius:50%;background:#e07a4f;animation:langDotBounce 1.3s infinite ease-in-out}
.lang-switch-dots span:nth-child(2){animation-delay:0.18s}
.lang-switch-dots span:nth-child(3){animation-delay:0.36s}
@keyframes langDotBounce{0%,80%,100%{transform:scale(0.5);opacity:0.35}40%{transform:scale(1.15);opacity:1}}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:10000;background:linear-gradient(160deg,#2a1f1a 0%,#1a1008 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity 0.7s cubic-bezier(.4,0,.2,1),visibility 0.7s}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;font-size:22px;opacity:0;animation:floatUp linear infinite;filter:drop-shadow(0 0 12px rgba(224,122,79,0.5))}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0deg) scale(0.6);opacity:0}10%{opacity:0.9}90%{opacity:0.9}100%{transform:translateY(-20vh) rotate(360deg) scale(1.1);opacity:0}}
.splash-logo-wrap{position:relative;width:130px;height:130px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.splash-logo-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(224,122,79,0.25);animation:ringPulse 2s ease-out infinite}
.splash-logo-ring:nth-child(2){animation-delay:0.6s}
@keyframes ringPulse{0%{transform:scale(0.6);opacity:0.8}100%{transform:scale(1.6);opacity:0}}
.splash-logo{font-size:74px;line-height:1;animation:logoIn 1.1s cubic-bezier(.34,1.56,.64,1) forwards;filter:drop-shadow(0 0 30px rgba(224,122,79,0.7));z-index:2}
@keyframes logoIn{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
.splash-title{font-size:2.6rem;font-weight:700;letter-spacing:-1px;color:#fefcf9;font-family:var(--font-display);opacity:0;animation:fadeInUp 0.7s 0.4s ease-out forwards;z-index:2}
.splash-title span{background:linear-gradient(135deg,#e07a4f,#f0b27a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.splash-sub{font-size:0.95rem;color:#b0a096;margin-top:6px;opacity:0;animation:fadeInUp 0.7s 0.6s ease-out forwards;z-index:2}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.splash-dots{display:flex;gap:9px;margin-top:36px;opacity:0;animation:fadeInUp 0.7s 0.8s ease-out forwards;z-index:2}
.splash-dots span{width:9px;height:9px;border-radius:50%;background:#e07a4f;animation:dotBounce 1.3s infinite ease-in-out}
.splash-dots span:nth-child(2){animation-delay:0.18s}
.splash-dots span:nth-child(3){animation-delay:0.36s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0.5);opacity:0.35}40%{transform:scale(1.15);opacity:1}}

/* APP */
#app{max-width:1240px;margin:0 auto;padding:14px 16px 20px;min-height:100vh;opacity:0;transition:opacity 0.6s ease}
#app.ready{opacity:1}
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-top:8px;position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding-bottom:12px}
.header-left{display:flex;flex-direction:column;gap:2px}
.header-greeting{font-size:0.78rem;color:var(--text-muted);font-weight:500}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.35rem;letter-spacing:-0.5px;font-family:var(--font-display)}
.brand-icon{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#f5e6d8,#eadfd2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:1.05rem;box-shadow:var(--shadow-sm)}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.25s;box-shadow:var(--shadow-xs);position:relative}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn:active{transform:scale(0.92)}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#ef4444;display:none;border:2px solid var(--surface)}
.icon-btn.has-dot .dot{display:block}
.glass-card{background:var(--surface-glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.hero{padding:24px 22px 26px;position:relative;overflow:hidden;margin-bottom:16px;background:var(--surface)}
.hero-eyebrow{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:60px;background:var(--accent-soft);color:var(--accent-2);font-size:0.7rem;font-weight:700;letter-spacing:0.5px;margin-bottom:14px;text-transform:uppercase}
.hero-title{font-size:1.9rem;font-weight:700;letter-spacing:-0.8px;line-height:1.15;margin-bottom:8px;font-family:var(--font-display)}
.hero-title .accent-text{color:var(--accent);font-style:italic}
.hero-sub{color:var(--text-secondary);font-size:0.9rem;margin-bottom:20px;line-height:1.5}
.input-wrap{position:relative;margin-bottom:12px;z-index:3}
.input-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.95rem;pointer-events:none}
.input-field{width:100%;padding:15px 52px 15px 46px;border-radius:60px;border:1.5px solid var(--border);background:var(--surface-warm);color:var(--text-primary);font-size:0.94rem;font-weight:500;outline:none;transition:all 0.25s;box-shadow:var(--shadow-xs)}
.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.input-add-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:0.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px var(--accent-glow)}
.autocomplete-box{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);max-height:220px;overflow-y:auto;z-index:100;display:none}
.autocomplete-box.show{display:block}
.ac-item{padding:11px 18px;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;gap:10px;color:var(--text-secondary)}
.ac-item:hover{background:var(--accent-soft);color:var(--accent-2)}
.ac-item .ac-emoji{font-size:1.05rem}
.ac-item .ac-add{margin-left:auto;font-size:0.72rem;color:var(--text-muted)}
.ac-item .ac-alias{font-size:0.7rem;color:var(--text-muted);margin-left:4px}
.chips-container{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px;min-height:36px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--accent-soft);color:var(--accent-2);border-radius:60px;font-size:0.85rem;font-weight:600;border:1px solid rgba(198,93,59,0.15);animation:chipPop 0.35s cubic-bezier(.34,1.56,.64,1)}
@keyframes chipPop{0%{transform:scale(0.5) translateY(6px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.chip .chip-emoji{font-size:0.95rem}
.chip .chip-remove{width:20px;height:20px;border-radius:50%;border:none;background:rgba(198,93,59,0.15);color:var(--accent-2);font-size:0.62rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chip .chip-remove:hover{background:var(--accent);color:#fff}
.section-label{font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-label i{color:var(--accent);font-size:0.8rem}
.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.suggestion-chip{padding:8px 15px;border-radius:60px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.25s;display:inline-flex;align-items:center;gap:6px}
.suggestion-chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.suggestion-chip.added{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Servings selector */
.servings-selector{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.serving-btn{flex:1;min-width:70px;padding:12px 8px;border-radius:16px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.25s;display:flex;flex-direction:column;align-items:center;gap:3px}
.serving-btn .serving-num{font-size:1.15rem;font-weight:800;color:var(--text-primary);font-family:var(--font-display);line-height:1}
.serving-btn .serving-label{font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;font-weight:700}
.serving-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.serving-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:var(--accent);box-shadow:0 6px 18px var(--accent-glow)}
.serving-btn.active .serving-num,
.serving-btn.active .serving-label{color:#fff}

.goal-selector{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:4px;scrollbar-width:none}
.goal-selector::-webkit-scrollbar{display:none}
.goal-chip{flex-shrink:0;padding:9px 16px;border-radius:60px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.25s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.goal-chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:var(--accent);box-shadow:0 6px 18px var(--accent-glow)}
.btn-primary{width:100%;padding:16px;border-radius:60px;border:none;background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;font-weight:700;font-size:1rem;letter-spacing:0.3px;cursor:pointer;box-shadow:0 8px 24px var(--accent-glow);transition:all 0.3s;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-primary:active{transform:scale(0.97)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed}
.btn-primary .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.4);transform:scale(0);animation:rippleAnim 0.7s linear;pointer-events:none}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}
.section-title{font-size:1.15rem;font-weight:700;letter-spacing:-0.3px;margin:24px 0 14px;display:flex;align-items:center;gap:10px;font-family:var(--font-display)}
.section-title i{color:var(--accent);font-size:1rem}
.category-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.category-scroll::-webkit-scrollbar{display:none}
.category-card{flex:0 0 auto;padding:12px 18px;border-radius:16px;background:var(--surface);border:1.5px solid var(--border);font-weight:600;font-size:0.83rem;color:var(--text-secondary);cursor:pointer;transition:all 0.3s;white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-xs)}
.category-card:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.recipe-grid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:14px}
@media(min-width:560px){.recipe-grid{grid-template-columns:1fr 1fr}}
@media(min-width:940px){.recipe-grid{grid-template-columns:1fr 1fr 1fr}}
.recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform 0.35s,box-shadow 0.3s;cursor:pointer;animation:cardIn 0.55s cubic-bezier(.34,1.56,.64,1) backwards;display:flex;flex-direction:column;position:relative}
@keyframes cardIn{0%{opacity:0;transform:translateY(28px) scale(0.94)}100%{opacity:1;transform:translateY(0) scale(1)}}
.recipe-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.recipe-emoji-hero{height:140px;background:linear-gradient(135deg,#fef3e6,#fbe0cd);display:flex;align-items:center;justify-content:center;font-size:4.5rem;position:relative;overflow:hidden}
.recipe-emoji-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.5),transparent 60%)}
.recipe-emoji-hero .emoji-big{position:relative;z-index:2;animation:emojiFloat 3.5s ease-in-out infinite}
@keyframes emojiFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.recipe-time-badge{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:60px;background:rgba(253,249,243,0.95);backdrop-filter:blur(8px);font-size:0.72rem;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:5px;box-shadow:var(--shadow-sm);z-index:3}
.recipe-time-badge i{color:var(--accent)}
.recipe-fav-float{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(253,249,243,0.95);backdrop-filter:blur(8px);color:var(--text-muted);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;box-shadow:var(--shadow-sm);z-index:3}
.recipe-fav-float.active{color:#c65d3b}
.recipe-body{padding:16px;flex:1;display:flex;flex-direction:column}
.recipe-name{font-weight:700;font-size:1.02rem;margin-bottom:5px;color:var(--text-primary);line-height:1.3;font-family:var(--font-display)}
.recipe-desc{font-size:0.79rem;color:var(--text-muted);margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.recipe-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;margin-bottom:12px}
.badge{padding:4px 10px;border-radius:60px;font-size:0.68rem;font-weight:700;background:var(--accent-soft);color:var(--accent-2);display:inline-flex;align-items:center;gap:4px}
.badge.gray{background:var(--surface-warm);color:var(--text-secondary)}
.badge.protein{background:#fef3c7;color:#b45309}
.badge.servings{background:#e3efe5;color:#2d5d3a}
.btn-view{width:100%;padding:11px;border-radius:60px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:0.83rem;cursor:pointer;transition:all 0.25s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-view:hover{background:var(--accent);color:#fff}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.85rem}

  'olive oil':'Olive Oil','lemon juice':'Nimbu Ras','mixed greens':'Mixed Greens',
  'spring onion':'Hara Pyaz','greek yogurt':'Greek Dahi','vegetable stock':'Sabzi Stock'
};
const HI_TO_EN = {};
Object.entries(EN_TO_HI).forEach(([en, hi]) => { HI_TO_EN[hi.toLowerCase()] = en; });

function normalizeIngredient(input) {
  const raw = input.trim();
  const lower = raw.toLowerCase();
  if (HI_TO_EN[lower]) return HI_TO_EN[lower];
  const lowerCap = raw.charAt(0).toLowerCase() + raw.slice(1).toLowerCase();
  if (HI_TO_EN[lowerCap]) return HI_TO_EN[lowerCap];
  if (EN_TO_HI[lower]) return lower;
  return raw.charAt(0).toUpperCase() + raw.slice(1);
}
function displayName(canonical) {
  if (state.language === 'hi') {
    const key = String(canonical).toLowerCase().trim();
    if (EN_TO_HI[key]) return EN_TO_HI[key];
    if (HI_TO_EN[key]) return canonical;
    return canonical;
  }
  const key = String(canonical).toLowerCase().trim();
  if (HI_TO_EN[key]) return HI_TO_EN[key];
  return canonical;
}
function displayIngredientLine(line) {
  if (state.language !== 'hi') return line;
  let out = line;
  Object.entries(EN_TO_HI).forEach(([en, hi]) => {
    const re = new RegExp('\\b' + en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi');
    out = out.replace(re, hi);
  });
  return out;
}
function t(key) { return (T[state.language] || T.en)[key] || key; }

  c.appendChild(el);

function attachRipple(btn) {
  if (!btn) return;
  btn.addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top = (e.clientY - rect.top - size/2) + 'px';
    this.appendChild(r);
    setTimeout(() => r.remove(), 700);
  });
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTune() {
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const notes = [{f:523.25,t:0.00,d:0.18},{f:659.25,t:0.15,d:0.18},{f:783.99,t:0.30,d:0.18},{f:1046.50,t:0.45,d:0.40}];
  notes.forEach(n => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(n.f, now+n.t);
    g.gain.setValueAtTime(0, now+n.t);
    g.gain.linearRampToValueAtTime(0.12, now+n.t+0.03);
    g.gain.exponentialRampToValueAtTime(0.001, now+n.t+n.d);
    o.connect(g); g.connect(ctx.destination);
    o.start(now+n.t); o.stop(now+n.t+n.d+0.05);
  });
}
function playDing() {
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(880, now);
  o.frequency.exponentialRampToValueAtTime(1320, now+0.12);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.1, now+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, now+0.35);
  o.connect(g); g.connect(ctx.destination);
  o.start(now); o.stop(now+0.4);
}
function playClick() {
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(600, now);
  o.frequency.exponentialRampToValueAtTime(300, now+0.08);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.06, now+0.01);
  g.gain.exponentialRampToValueAtTime(0.001, now+0.12);
  o.connect(g); g.connect(ctx.destination);
  o.start(now); o.stop(now+0.15);
}
function playError() {
  const ctx = getAudioCtx(); if (!ctx) return;
  const now = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(200, now);
  o.frequency.linearRampToValueAtTime(120, now+0.25);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.08, now+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, now+0.3);
  o.connect(g); g.connect(ctx.destination);
  o.start(now); o.stop(now+0.32);
}

/* ============================================================
   RECIPE GENERATION
   ============================================================ */
async function generateRecipes(ingredients, goal='balanced', servings=4) {
  if (!ingredients || ingredients.length === 0) {
    showToast(t('addIngredient'),'warning'); playError(); return [];
  }
  if (state.isLoading) return [];
  state.isLoading = true;
  const btn = document.getElementById('generateBtn');
  if (btn) btn.disabled = true;
  playTune();
  showLoading(true);
  try {
    await new Promise(r => setTimeout(r, 1400));
    const recipes = buildLocalRecipes(ingredients, goal, servings);
    if (!recipes || recipes.length < 3) throw new Error("Insufficient recipes");
    state.history.unshift({
      id: Date.now().toString(),
      timestamp: new Date().toISOString(),
      ingredients: [...ingredients],
      goal, servings, recipes
    });
    if (state.history.length > 20) state.history.pop();
    saveHist();
    if (firebaseReady && firebaseDB) {
      try {
        firebaseDB.ref('pakgharApp/stats').transaction(c => ({
          totalGenerations: (c?.totalGenerations || 0) + 1,
          totalRecipes: (c?.totalRecipes || 0) + recipes.length
        }));
      } catch(e){ console.warn(e); }
    }
    state.generatedRecipes = recipes;
    state.currentRecipes = [...recipes];
    state.activeFilter = 'All';
    state.searchQuery = '';
    state.sortBy = 'quickest';
    showToast(`✨ ${recipes.length} ${t('generated')}`, 'success');
    playDing();
    return recipes;
  } catch(err) {
    console.error(err);
    showToast(t('genFailed'),'error');
    playError();
    return [];
  } finally {
    state.isLoading = false;
    if (btn) btn.disabled = false;
    showLoading(false);
  }
}

  return templates.map((tpl, i) => {
    const baseCal = 220 + (i * 40);
    const basePro = 8 + (i % 3) * 4;
    const baseCarb = 30 + (i * 5);
    const baseFat = 8 + (i % 2) * 3;
    // Scale nutrition by servings (base 4 people per recipe metric)
    const scaleN = serv / 4;
    return {
      id: 'ghar_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 6),
      name: tpl.name,
      description: tpl.description,
      cuisine: tpl.cuisine,

      difficulty: tpl.difficulty,
      servings: serv,
      prepTime: tpl.prepTime,

      totalTime: tpl.totalTime,
      ingredients: tpl.ingredients,
      instructions: tpl.instructions,
      tips: tpl.tips,
      nutrition: {
        calories: `${Math.round(baseCal * scaleN)} kcal`,
        protein: `${Math.round(basePro * scaleN)}g`,
        carbs: `${Math.round(baseCarb * scaleN)}g`,
        fat: `${Math.round(baseFat * scaleN)}g`
      },
      goal: g,
      servingsCount: serv
    };
  });
}

function buildRecipeText(recipe) {
  const L = state.language === 'hi' ? {
    title: '🍲 *PakGhar Recipe* 🍲',
    name: '📖 Naam',
    desc: '📝 Description',
    servings: '👥 Kitne logon ka',
    time: '⏱️ Time',
    prep: 'Prep', cook: 'Cook', total: 'Total',
    difficulty: '🎯 Difficulty',
    cuisine: '🌏 Cuisine',
    ingredients: '🥕 *Ingredients*',
    instructions: '👨‍🍳 *Banane ka tarika*',
    tips: '💡 *Tips*',
    nutrition: '📊 *Nutrition (per person)*',
    cal: 'Calories', pro: 'Protein', carb: 'Carbs', fat: 'Fat',
    enjoy: '🙏 *PakGhar se bana ke khaayein — Aayan Likhar*'
  } : {
    title: '🍲 *PakGhar Recipe* 🍲',
    name: '📖 Name',
    desc: '📝 Description',
    servings: '👥 Serves',
    time: '⏱️ Time',
    prep: 'Prep', cook: 'Cook', total: 'Total',
    difficulty: '🎯 Difficulty',
    cuisine: '🌏 Cuisine',
    ingredients: '🥕 *Ingredients*',
    instructions: '👨‍🍳 *Instructions*',
    tips: '💡 *Tips*',
    nutrition: '📊 *Nutrition (per person)*',
    cal: 'Calories', pro: 'Protein', carb: 'Carbs', fat: 'Fat',
    enjoy: '🙏 *Made with PakGhar — by Aayan Likhar*'
  };

  let text = `${L.title}\n\n`;
  text += `${L.name}: *${recipe.name}*\n\n`;
  text += `${L.desc}: ${recipe.description}\n\n`;
  text += `${L.servings}: ${recipe.servings} ${recipe.servings === 1 ? 'person' : 'people'}\n`;
  text += `${L.time}: Prep ${recipe.prepTime} | Cook ${recipe.cookTime} | Total ${recipe.totalTime}\n`;
  text += `${L.difficulty}: ${recipe.difficulty}\n`;
  text += `${L.cuisine}: ${recipe.cuisine}\n\n`;
  text += `${L.ingredients}\n`;
  recipe.ingredients.forEach(ing => { text += `• ${ing}\n`; });
  text += `\n${L.instructions}\n`;
  recipe.instructions.forEach((step, i) => { text += `${i + 1}. ${step}\n`; });
  if (recipe.tips && recipe.tips.length > 0) {
    text += `\n${L.tips}\n`;
    recipe.tips.forEach(tip => { text += `• ${tip}\n`; });
  }
  text += `\n${L.nutrition}\n`;
  text += `• ${L.cal}: ${recipe.nutrition.calories}\n`;
  text += `• ${L.pro}: ${recipe.nutrition.protein}\n`;
  text += `• ${L.carb}: ${recipe.nutrition.carbs}\n`;
  text += `• ${L.fat}: ${recipe.nutrition.fat}\n\n`;
  text += L.enjoy;
  return text;
}

function shareRecipeWhatsApp(recipe) {
  const text = buildRecipeText(recipe);
  const encoded = encodeURIComponent(text);
  const url = `https://wa.me/?text=${encoded}`;
  window.open(url, '_blank');
  playDing();
  showToast(state.language === 'hi' ? 'WhatsApp khul raha hai...' : 'Opening WhatsApp...', 'success', 2000);
}

    const matches = [];

      if (state.ingredients.some(s => s.toLowerCase() === canonical)) return;

    btn.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.serving-btn').forEach(b => b.classList.remove('active'));

      saveServ();
      playClick();
      showToast(`${t('peopleSet')}: ${state.servings} ${state.servings === 1 ? t('person') : t('people')}`, 'success', 1800);
    });
  });

  const catMap = {
    'Quick Meals':['Onion','Tomato','Capsicum'],
    'Indian':['Potato','Cauliflower','Peas'],
    'Healthy':['Spinach','Carrot','Corn'],
    'Dinner':['Paneer','Tomato','Onion'],

function applyFiltersAndRender() {
  let recipes = [...state.generatedRecipes];
  if (state.searchQuery.trim()) {
    const q = state.searchQuery.toLowerCase();
    recipes = recipes.filter(r =>
      r.name.toLowerCase().includes(q) ||
      r.description.toLowerCase().includes(q) ||
      r.cuisine.toLowerCase().includes(q) ||
      r.ingredients.join(' ').toLowerCase().includes(q)
    );
  }
  if (state.activeFilter !== 'All') {
    const f = state.activeFilter;
    recipes = recipes.filter(r => {
      if (f === 'Vegetarian') return true;
      if (f === 'Quick') return parseInt(r.totalTime) <= 30;
      if (f === 'Easy') return r.difficulty === 'Easy';
      if (f === 'Healthy') return parseInt(r.nutrition.calories) <= 500;
      if (f === 'High Protein') return parseInt(r.nutrition.protein) >= 12;
      if (f === 'Indian') return r.cuisine.toLowerCase().includes('indian');
      return r.cuisine.toLowerCase().includes(f.toLowerCase()) || r.mealType.toLowerCase().includes(f.toLowerCase());
    });
  }
  if (state.sortBy === 'quickest') recipes.sort((a,b) => parseInt(a.totalTime) - parseInt(b.totalTime));
  else if (state.sortBy === 'easiest') {
    const ord = {'Easy':1,'Medium':2,'Hard':3};
    recipes.sort((a,b) => (ord[a.difficulty]||2) - (ord[b.difficulty]||2));
  } else if (state.sortBy === 'mostIngredients') recipes.sort((a,b) => b.ingredients.length - a.ingredients.length);
  else if (state.sortBy === 'highestProtein') recipes.sort((a,b) => parseInt(b.nutrition.protein) - parseInt(a.nutrition.protein));
  state.currentRecipes = recipes;
  renderRecipeCards(recipes);
}

function renderRecipeCards(recipes) {
  const grid = document.getElementById('recipeGrid');
  if (!grid) return;

window.toggleFavorite = function(id) {
  const recipe = state.generatedRecipes.find(r => r.id === id)
    || state.history.flatMap(h => h.recipes).find(r => r.id === id)
    || state.favorites.find(r => r.id === id);
  if (!recipe) return;
  const idx = state.favorites.findIndex(f => f.id === id);
  if (idx === -1) {
    state.favorites.push(recipe);
    showToast(t('savedFav'),'success',2000);
    playDing();
  } else {
    state.favorites.splice(idx, 1);
    showToast(t('removedFav'),'info',2000);
    playClick();
  }
  saveFav();
  updateFavDot();
};

/* ============================================================
   KEYBOARD DETECTION
   ============================================================ */
function initKeyboardDetection() {
  let initialHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  let keyboardOpen = false;
  function setKeyboard(open) {
    if (keyboardOpen === open) return;
    keyboardOpen = open;
    if (open) {
      document.body.classList.add('keyboard-open');
    } else {
      document.body.classList.remove('keyboard-open');
    }
  }
  function checkViewport() {
    if (!window.visualViewport) return;
    const vv = window.visualViewport;
    const heightDiff = initialHeight - vv.height;
    const isOpen = heightDiff > 150;
    setKeyboard(isOpen);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', checkViewport);
    window.visualViewport.addEventListener('scroll', checkViewport);
  }
  document.addEventListener('focusin', (e) => {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') setKeyboard(true);
  });
  document.addEventListener('focusout', () => {
    setTimeout(() => {
      const active = document.activeElement;
      const tag = active ? active.tagName : '';
      if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') setKeyboard(false);
    }, 100);
  });
  window.addEventListener('resize', () => {
    initialHeight = Math.max(initialHeight, window.innerHeight);
    checkViewport();
  });
}

function switchLanguage(newLang) {
  if (state.switchingLang) return;
  state.switchingLang = true;
  const overlay = document.getElementById('langSwitchOverlay');
  const icon = document.getElementById('langSwitchIcon');
  const text = document.getElementById('langSwitchText');
  const sub = document.getElementById('langSwitchSub');
  const isEn = newLang === 'en';
  icon.textContent = isEn ? '🇬🇧' : '🇮🇳';
  const newT = T[newLang];
  text.innerHTML = `${newT.switchingTo} <span>${isEn ? 'English' : 'Hinglish'}</span>`;
  sub.textContent = newT.switchingSub;
  icon.style.animation = 'none';
  void icon.offsetWidth;
  icon.style.animation = 'langIconSpin 1s cubic-bezier(.34,1.56,.64,1) forwards';
  overlay.classList.add('active');
  playDing();
  setTimeout(() => {
    state.language = newLang;
    saveLang();
    updateGreeting();
    updateNavLabels();
    if (state.viewingDetail) {
      renderDetailView(state.viewingDetail);
    } else if (state.showRecipes && state.generatedRecipes.length > 0) {
      renderRecipeListSection();
    } else {
      renderHome();
    }
    setTimeout(() => {
      overlay.classList.remove('active');
      state.switchingLang = false;
      showToast(newLang === 'hi' ? '🇮🇳 Hinglish chuna gaya!' : '🇬🇧 English selected!', 'success', 1800);
    }, 500);
  }, 1100);
}

/* ============================================================
   PARTICLES
   ============================================================ */
function initSplashParticles() {
  const c = document.getElementById('splashParticles');
  if (!c) return;
  const foods = ['🍅','🥕','🥦','🧄','🧅','🌽','🍋','🥬','🍄','🫑'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = foods[Math.floor(Math.random() * foods.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 4) + 's';
    p.style.fontSize = (16 + Math.random() * 18) + 'px';
    c.appendChild(p);
  }
}
function initLangParticles() {
  const c = document.getElementById('langParticles');
  if (!c) return;
  const foods = ['🍅','🥕','🥦','🧄','🧅','🌽','🍋','🥬','🍄','🫑'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'lang-particle';
    p.textContent = foods[Math.floor(Math.random() * foods.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (9 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 5) + 's';
    p.style.fontSize = (16 + Math.random() * 18) + 'px';
    c.appendChild(p);
  }
}

/* ============================================================
   LANGUAGE MODAL
   ============================================================ */
function showLanguageModal() {
  const modal = document.getElementById('langModal');
  modal.classList.remove('hidden');
  initLangParticles();
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.language = btn.dataset.lang;
      saveLang();
      localStorage.setItem(LS.LANG_CHOSEN, 'true');
      modal.classList.add('hidden');
      playDing();
      showToast(state.language === 'hi' ? '🇮🇳 Hinglish chuna gaya!' : '🇬🇧 English selected!', 'success', 2200);
      setTimeout(() => {
        updateGreeting();
        updateNavLabels();
        resetToHome();
      }, 300);
    });
  });
}

/* ============================================================
   BACK BUTTON
   ============================================================ */
window.addEventListener('popstate', () => {
  if (state.viewingDetail) {
    state.viewingDetail = null;
    if (state.showRecipes && state.generatedRecipes.length > 0) {
      renderRecipeListSection();
    } else {
      resetToHome();
    }
    history.pushState({app:'pakghar'}, '');
    return;
  }
  if (state.showRecipes) {
    resetToHome();
    history.pushState({app:'pakghar'}, '');
    return;
  }
  if (state.currentTab !== 'home') {
    switchTab('home');
    history.pushState({app:'pakghar'}, '');
    return;
  }
  if (state.currentTab === 'home') {
    if (!state.backPressedOnce) {
      state.backPressedOnce = true;
      showToast(t('exitApp'),'warning',2000);
      playError();
      setTimeout(() => { state.backPressedOnce = false; }, 2200);
      history.pushState({app:'pakghar'}, '');
    } else {
      window.history.back();
    }
  }
});

/* ============================================================
   INIT — binds ALL nav buttons before app shows
   ============================================================ */
function bindAllEvents() {
  // Nav buttons
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      playClick();
      switchTab(item.dataset.tab);
    });
  });

  // Header buttons
  const favHeaderBtn = document.getElementById('favHeaderBtn');
  if (favHeaderBtn) {
    favHeaderBtn.addEventListener('click', (e) => {
      e.preventDefault();
      switchTab('favorites');
    });
  }

  const langSwitchBtn = document.getElementById('langSwitchBtn');
  if (langSwitchBtn) {
    langSwitchBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const newLang = state.language === 'en' ? 'hi' : 'en';
      switchLanguage(newLang);
    });
  }
}

function initApp() {
  loadStorage();
  updateFavDot();
  updateGreeting();
  updateNavLabels();
  initKeyboardDetection();
  bindAllEvents();

  if (firebaseReady && firebaseDB) {
    try {
      firebaseDB.ref('pakgharApp/stats').on('value', snap => {
        const s = snap.val();
        if (s) console.log('📊 Realtime stats:', s);
      });
    } catch(e){ console.warn(e); }
  }

  history.pushState({app:'pakghar'}, '');

  const app = document.getElementById('app');
  app.classList.remove('hidden');
  requestAnimationFrame(() => app.classList.add('ready'));

  resetToHome();
}

window.addEventListener('load', () => {
  initSplashParticles();
  setTimeout(() => {
    document.getElementById('splash').classList.add('hidden');
    const langChosen = localStorage.getItem(LS.LANG_CHOSEN);
    if (langChosen === 'true') {
      initApp();
    } else {
      // Bind nav BEFORE showing lang modal so buttons work
      bindAllEvents();
      showLanguageModal();
      loadStorage();
      updateGreeting();
      updateNavLabels();
      initKeyboardDetection();
      setTimeout(() => {
        document.getElementById('app').classList.remove('hidden');
        requestAnimationFrame(() => document.getElementById('app').classList.add('ready'));
        resetToHome();
      }, 100);
    }
  }, 2600);
});

window.removeIngredient = removeIngredient;
window.switchTab = switchTab;
window.toggleFavorite = toggleFavorite;
window.openRecipeDetail = openRecipeDetail;
window.loadHistory = loadHistory;
window.resetToHome = resetToHome;
</script>
</body>
